version: '3.8'
services:
  # =============================================
  # 1) DATABASE - PostgreSQL
  # =============================================
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: erp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Ifserp12/*"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================
  # 2) BACKEND - .NET API
  # =============================================
  backend:
    build:
      context: ./Erp.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://0.0.0.0:80"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=erp_db;Username=postgres;Password=Ifserp12/*;Pooling=true;"
      Jwt__Key: "ThisIsA32CharacterLongSecretKeyForJWT!!1234567890"
      Jwt__Issuer: "erp-api"
      Jwt__Audience: "erp-client"
      Jwt__ExpireMinutes: "60"
    expose:
      - "80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # =============================================
  # 3) FRONTEND - React + Nginx
  # =============================================
  frontend:
    build:
      context: ./erp-ui
      dockerfile: Dockerfile
    ports:
      - "80:80"          # HTTP için
      - "443:443"        # HTTPS için (SSL eklendiğinde)
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: